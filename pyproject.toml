[project]
name = "voice-model-playground"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aaina Batool", email = "b.aaina@yahoo.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.141.1",
    "kokoro>=0.9.4",
    "piper-tts>=1.7.0",
    "pydantic-settings>=2.15.0",
    "soundfile>=0.14.0",
    "uvicorn[standard]>=0.52.3",
]

[project.scripts]
voice-model-playground = "voice_model_playground:main"

[build-system]
